services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: data-logger-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer:latest
    container_name: data-logger-mqtt-explorer
    ports:
      - "8081:4000"
    environment:
      HTTP_PORT: 4000
    depends_on:
      - mosquitto
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: data-logger-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: telemetry
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build: ./backend
    container_name: data-logger-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: nodejs-timescale-ingestor
      MQTT_TOPICS: gateways/+/telemetry
      DATABASE_URL: postgres://postgres:postgrespassword@timescaledb:5432/telemetry
      BATCH_SIZE: 500
      FLUSH_INTERVAL_MS: 2000
      MAX_RETRY_DELAY_MS: 30000
    depends_on:
      mosquitto:
        condition: service_started
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: data-logger-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mosquitto_data:
  timescaledb_data:
