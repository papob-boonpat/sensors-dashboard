# =============================================================================
# Eclipse Mosquitto Configuration — Zero Data Loss / Persistent QoS 1 Queuing
# =============================================================================

# Standard MQTT TCP listener (ECU-1051 / ECU-1251D gateways & Node.js ingestor)
listener 1883
allow_anonymous true

# WebSocket listener for browser-based MQTT UI (MQTTX Web)
listener 9001
protocol websockets
allow_anonymous true

# Disk persistence so queued QoS 1 messages survive broker restarts
persistence true
persistence_location /mosquitto/data/

# Unlimited offline queue (bounded by host RAM/disk) so bursts from ~100
# sensors are not dropped while the Node.js backend is offline or flushing
max_queued_messages 0
max_inflight_messages 100

# Retain persistent client sessions (clean=false) for 24 hours during
# extended backend maintenance or pod outages
persistent_client_expiration 24h

log_dest stdout
