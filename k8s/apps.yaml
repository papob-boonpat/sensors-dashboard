apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-logger-backend
  namespace: data-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-logger-backend
  template:
    metadata:
      labels:
        app: data-logger-backend
    spec:
      containers:
        - name: backend
          image: data-logger-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MQTT_URL
              value: mqtt://mosquitto:1883
            - name: MQTT_TOPICS
              value: gateways/+/telemetry
            - name: BATCH_SIZE
              value: "500"
            - name: FLUSH_INTERVAL_MS
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secrets
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: data-logger-backend
  namespace: data-logger
spec:
  selector:
    app: data-logger-backend
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-logger-frontend
  namespace: data-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-logger-frontend
  template:
    metadata:
      labels:
        app: data-logger-frontend
    spec:
      containers:
        - name: frontend
          image: data-logger-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: data-logger-frontend
  namespace: data-logger
spec:
  type: LoadBalancer
  selector:
    app: data-logger-frontend
  ports:
    - port: 80
      targetPort: 80
